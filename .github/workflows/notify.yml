# 새 인포그래픽(briefings/YYYY-MM-DD.png)이 push되면 이미지를 넣은 이슈를 만든다.
# 저장소를 Watch 중인 소유자에게 GitHub가 알림 메일을 보내고, 그 메일 본문에 이미지가 보인다.
name: Notify briefing

on:
  push:
    branches: [main]
    paths: ["briefings/*.png"]
  workflow_dispatch:
    inputs:
      date:
        description: "알림을 보낼 날짜 (YYYY-MM-DD, 비우면 최신)"
        required: false
      force:
        description: "같은 날짜 이슈가 있어도 다시 보내기"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create issue with infographic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          DAY="${INPUT_DATE:-$(ls briefings | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.png$' | sort | tail -1 | cut -c1-10)}"
          [ -f "briefings/$DAY.png" ] || { echo "no image for $DAY"; exit 1; }
          TITLE="[국방물류·군수AI 인포그래픽] $DAY"

          # 같은 날짜 이슈가 이미 있으면 중복 생성하지 않는다(재렌더링 push 대비)
          if [ "${FORCE:-false}" != "true" ] && gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$TITLE\" in:title" --json title -q '.[].title' | grep -qxF "$TITLE"; then
            echo "issue exists for $DAY"; exit 0
          fi

          RAW="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/briefings"
          ISSUE=$(python3 - "$DAY" <<'PY'
          import json, sys
          d = json.load(open("data.json", encoding="utf-8"))
          y, m, dd = sys.argv[1].split("-")
          if f"{y}. {int(m)}. {int(dd)}." in d.get("date", ""):
              print(f"{d.get('issue','')} · {d.get('date','')}\n\n**{d.get('subtitle','')}**")
          else:
              print(f"{y}. {int(m)}. {int(dd)}.")
          PY
          )
          BODY=$(cat <<EOF
          $ISSUE

          [![인포그래픽 $DAY]($RAW/$DAY.png)]($RAW/$DAY.png)

          📄 [A4 PDF 내려받기]($RAW/$DAY.pdf) · 🖼️ [고해상도 PNG]($RAW/$DAY.png)

          <sub>상세 브리핑은 같은 날 Gmail로 받은 '[국방물류·군수AI 브리핑] $DAY' 메일을 보세요.</sub>
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
